<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ceZar COFFEE | سيزر كوفي - قائمة المشروبات والحلويات</title>
    <!-- Google Fonts Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-espresso: #2B1810;
            --primary-dark: #190E09;
            --cezar-orange: #E85D04;
            --cezar-gold: #D4A373;
            --bg-body: #F8F5F0;
            --card-bg: #FFFFFF;
            --text-main: #212529;
            --text-muted: #6C757D;
            --border-color: #EDE8E1;
            --shadow-sm: 0 2px 10px rgba(43, 24, 16, 0.05);
            --shadow-md: 0 6px 20px rgba(43, 24, 16, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding-bottom: 40px;
        }

        /* Top Brand Header */
        .brand-header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-espresso) 100%);
            color: white;
            padding: 24px 18px 20px;
            text-align: center;
            border-bottom-left-radius: 28px;
            border-bottom-right-radius: 28px;
            box-shadow: 0 6px 24px rgba(25, 14, 9, 0.3);
            position: relative;
        }

        .brand-logo-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--cezar-gold);
            background: white;
            box-shadow: 0 4px 14px rgba(0,0,0,0.35);
            margin-bottom: 10px;
        }

        .brand-title {
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: #FFFFFF;
        }

        .brand-title span {
            color: var(--cezar-orange);
        }

        .brand-subtitle {
            font-size: 13px;
            color: var(--cezar-gold);
            margin-top: 3px;
            font-weight: 700;
        }

        /* Table Badge */
        .table-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(232, 93, 4, 0.18);
            border: 1px solid var(--cezar-orange);
            color: #FFFFFF;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 800;
            margin-top: 12px;
            backdrop-filter: blur(5px);
        }

        /* Sticky Search & Category Navigation */
        .nav-sticky-wrapper {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(248, 245, 240, 0.96);
            backdrop-filter: blur(10px);
            padding: 12px 16px 8px;
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }

        .search-box {
            position: relative;
            margin-bottom: 10px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 42px 12px 16px;
            border-radius: 20px;
            border: 1px solid #E2D9CF;
            background: #FFFFFF;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box input:focus {
            border-color: var(--cezar-orange);
            box-shadow: 0 0 0 3px rgba(232, 93, 4, 0.15);
        }

        .search-box i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--cezar-gold);
            font-size: 16px;
        }

        .categories-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .categories-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-tab {
            white-space: nowrap;
            padding: 8px 16px;
            border-radius: 18px;
            background: #EFE9E0;
            color: var(--primary-espresso);
            font-size: 13px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .category-tab.active {
            background: linear-gradient(135deg, var(--primary-espresso) 0%, var(--primary-dark) 100%);
            color: #FFFFFF;
            box-shadow: 0 3px 10px rgba(43, 24, 16, 0.25);
        }

        /* Container & Menu Sections */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 22px 0 14px;
            padding-bottom: 6px;
            border-bottom: 2px dashed var(--cezar-gold);
        }

        .section-header h2 {
            font-size: 18px;
            font-weight: 900;
            color: var(--primary-espresso);
        }

        .section-header .count-badge {
            background: var(--cezar-orange);
            color: white;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .items-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 15px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .item-card:hover {
            box-shadow: var(--shadow-md);
        }

        .item-info {
            flex: 1;
            padding-left: 14px;
        }

        .item-name {
            font-size: 15px;
            font-weight: 800;
            color: var(--primary-espresso);
            line-height: 1.3;
        }

        .item-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            line-height: 1.4;
        }

        .item-price-badge {
            background: linear-gradient(135deg, rgba(232, 93, 4, 0.08) 0%, rgba(212, 163, 115, 0.15) 100%);
            border: 1.5px solid var(--cezar-orange);
            color: var(--cezar-orange);
            padding: 8px 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 900;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 6px rgba(232, 93, 4, 0.08);
        }

        .item-price-badge .currency {
            font-size: 12px;
            font-weight: 800;
            color: var(--primary-espresso);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 40px;
            color: var(--cezar-gold);
            margin-bottom: 12px;
        }

        /* Footer Branding */
        .brand-footer {
            text-align: center;
            padding: 30px 15px 40px;
            color: #8C827A;
            font-size: 12px;
        }

        .dev-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(43, 24, 16, 0.05);
            padding: 7px 16px;
            border-radius: 20px;
            border: 1px solid rgba(43, 24, 16, 0.08);
            flex-wrap: wrap;
            justify-content: center;
        }
    </style>
</head>

        let menuData = FALLBACK_MENU;

        // Parse Table Number from URL (?table=X)
        const urlParams = new URLSearchParams(window.location.search);
        const paramTable = parseInt(urlParams.get('table'));
        if (paramTable && paramTable >= 1 && paramTable <= 50) {
            document.getElementById('currentTableDisplay').textContent = `ترابيزة رقم ${paramTable}`;
            document.getElementById('tableDisplayWrapper').style.display = 'flex';
        }

        function getCategoryIcon(catName) {
            if (catName.includes('الكوفى') || catName.includes('كوفي') || catName.includes('قهوة')) return 'fa-mug-hot';
            if (catName.includes('ساخنة') || catName.includes('شاى') || catName.includes('سحلب')) return 'fa-mug-saucer';
            if (catName.includes('شيك')) return 'fa-blender';
            if (catName.includes('وافل')) return 'fa-stroopwafel';
            if (catName.includes('بان كيك')) return 'fa-pancake';
            if (catName.includes('فريش') || catName.includes('عصائر')) return 'fa-glass-water';
            if (catName.includes('صودا') || catName.includes('موهيتو')) return 'fa-champagne-glasses';
            if (catName.includes('أم على')) return 'fa-bowl-rice';
            if (catName.includes('أيس كريم')) return 'fa-ice-cream';
            if (catName.includes('فروت')) return 'fa-apple-whole';
            if (catName.includes('غازية')) return 'fa-bottle-droplet';
            if (catName.includes('شيشة')) return 'fa-fire-flame-curved';
            return 'fa-utensils';
        }

        // Fetch Menu Items from Server
        async function loadMenu() {
            try {
                const res = await fetch('/api/cezar/menu-items');
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.categories && Object.keys(data.categories).length > 0) {
                        menuData = data.categories;
                    }
                }
            } catch (e) {
                console.log('Serving offline/embedded menu data');
            }
            renderCategories();
            renderMenu();
        }

        function renderCategories() {
            const container = document.getElementById('categoriesScroll');
            container.innerHTML = '';

            const allTab = document.createElement('button');
            allTab.className = 'category-tab active';
            allTab.innerHTML = `<i class="fa-solid fa-star"></i> الكل`;
            allTab.onclick = () => filterCategory('all', allTab);
            container.appendChild(allTab);

            for (const cat of Object.keys(menuData)) {
                const icon = getCategoryIcon(cat);
                const btn = document.createElement('button');
                btn.className = 'category-tab';
                btn.innerHTML = `<i class="fa-solid ${icon}"></i> ${cat}`;
                btn.onclick = () => filterCategory(cat, btn);
                container.appendChild(btn);
            }
        }

        function filterCategory(targetCat, btnEl) {
            document.querySelectorAll('.category-tab').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');

            if (targetCat === 'all') {
                renderMenu();
            } else {
                const singleCatData = {};
                if (menuData[targetCat]) {
                    singleCatData[targetCat] = menuData[targetCat];
                }
                renderMenu(singleCatData);
            }
        }

        function renderMenu(dataToRender = menuData) {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            const categories = Object.entries(dataToRender);
            if (categories.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <p style="font-weight: 700;">لا توجد أصناف مطابقة للبحث</p>
                    </div>`;
                return;
            }

            for (const [catName, items] of categories) {
                const section = document.createElement('section');
                section.className = 'menu-section';

                const icon = getCategoryIcon(catName);
                section.innerHTML = `
                    <div class="section-header">
                        <i class="fa-solid ${icon}" style="color: var(--cezar-orange); font-size: 18px;"></i>
                        <h2>${catName}</h2>
                        <span class="count-badge">${items.length}</span>
                    </div>
                    <div class="items-grid"></div>
                `;

                container.appendChild(section);
                const grid = section.querySelector('.items-grid');

                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'item-card';

                    card.innerHTML = `
                        <div class="item-info">
                            <div class="item-name">${item.name}</div>
                            ${item.description ? `<div class="item-desc">${item.description}</div>` : ''}
                        </div>
                        <div class="item-price-badge">
                            <span>${item.price}</span>
                            <span class="currency">ج.م</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        }

        function handleSearch() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!q) {
                renderMenu();
                return;
            }

            const filtered = {};
            for (const [cat, items] of Object.entries(menuData)) {
                const matching = items.filter(it => 
                    it.name.toLowerCase().includes(q) || 
                    (it.description && it.description.toLowerCase().includes(q))
                );
                if (matching.length > 0) {
                    filtered[cat] = matching;
                }
            }
            renderMenu(filtered);
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', loadMenu);
    </script>
